; Long-lived workers: compile once, never re-check files.
opcache.enable=1
opcache.enable_cli=1
opcache.validate_timestamps=0
opcache.memory_consumption=256
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=20000

memory_limit=256M
expose_php=Off
; Errors go to the log (stderr), never into responses.
display_errors=Off
log_errors=On
